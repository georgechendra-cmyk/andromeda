name: Refresh model leaderboards
# Once a day: read LMArena's latest leaderboards and Epoch AI's benchmarks and commit arena.json, which Andromeda uses
# to pick the best model for each request. Nothing to set up: GitHub runs it on its own.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save hyparquet@1 fflate@0.8
      - run: node tools/arena.mjs arena.json
      - name: Commit if it changed
        run: |
          git config user.name "andromeda-bot"
          git config user.email "andromeda-bot@users.noreply.github.com"
          git add arena.json
          git diff --cached --quiet || (git commit -m "Refresh model leaderboards" && git push)
