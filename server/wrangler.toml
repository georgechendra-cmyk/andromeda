name = "andromeda-credits"
main = "worker.js"
compatibility_date = "2025-06-01"

[vars]
# the site allowed to call this server (your GitHub Pages address)
ALLOWED_ORIGINS = "https://georgechendra-cmyk.github.io"
SITE_URL = "https://georgechendra-cmyk.github.io/andromeda/"

[[d1_databases]]
binding = "DB"
database_name = "andromeda"
database_id = "06f2a301-f884-4f49-a715-6175ce84c399"

# Cloudflare's own AI models (GPT-OSS, Llama, Mistral, Qwen): free within the account's daily allowance, no key needed;
# Andromeda falls back to them when no other way carries a model
[ai]
binding = "AI"

# scheduled tasks: every 10 minutes the ones that are due run
[triggers]
crons = ["*/10 * * * *"]

# Secrets are NOT written here. Set them once with:
#   npx wrangler secret put ADMIN_TOKEN
#   npx wrangler secret put PEPPER
# and at least one way to reach the models (see README.md):
#   npx wrangler secret put WAVESPEED_KEY   (WaveSpeed: every lab's big models at their own prices; asked first)
#   npx wrangler secret put GATEWAY_URL    (a gateway topped up in rupiah by QRIS, OVO included: e.g. https://api.anoman.io/v1)
#   npx wrangler secret put GATEWAY_KEY     (its API key; it goes first for every model it carries)
#   npx wrangler secret put CF_ACCOUNT_ID   (Cloudflare AI Gateway Unified Billing: GPT, Claude, Gemini, Grok)
#   npx wrangler secret put CF_API_TOKEN    (an API token with Workers AI Read; CF_GATEWAY too, to use a named gateway)
#   npx wrangler secret put OPENROUTER_KEY  (optional: every other model, and pictures, video and voice)
# optional:
#   npx wrangler secret put TAVILY_KEY      (live web search for Gemini and Grok through Cloudflare; 1,000 free a month)
#   npx wrangler secret put LEMON_SECRET    (only when card payments are set up)
#   npx wrangler secret put GOOGLE_CLIENT_ID (the "Continue with Google" button: an OAuth client ID for the site's address)
